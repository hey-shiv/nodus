ure exists</tspan><tspan x="64" dy="19">and other changes follow it</tspan></text><text x="64" y="278" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" letter-spacing="0.8" fill="#5A5B53" text-anchor="start"><tspan x="64" dy="0">CLOUDFLARE</tspan></text><line x1="364" y1="242" x2="516" y2="242" stroke="#23241F" stroke-width="1.5"/><rect x="431" y="233" width="18" height="18" fill="#23241F"/><text x="526" y="236" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#23241F" text-anchor="start"><tspan x="526" dy="0">Canary batch first, then all</tspan><tspan x="526" dy="19">depots</tspan></text><line x1="64" y1="296" x2="816" y2="296" stroke="#B9B7AC" stroke-width="0.75"/></g><g class="row holds"><title>A1.3: This change does not follow the staged procedure | plan: not following “Canary batch first, then all depots”</title><text x="24" y="322" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="500" letter-spacing="0" fill="#5A5B53" text-anchor="start"><tspan x="24" dy="0">A1.3</tspan></text><text x="64" y="322" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#23241F" text-anchor="start"><tspan x="64" dy="0">This change does not follow the</tspan><tspan x="64" dy="19">staged procedure</tspan></text><text x="64" y="364" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" letter-spacing="0.8" fill="#5A5B53" text-anchor="start"><tspan x="64" dy="0">CLOUDFLARE, CROWDSTRIKE</tspan></text><line x1="364" y1="328" x2="516" y2="328" stroke="#23241F" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="431" y="319" width="18" height="18" fill="#F1F0EA" stroke="#23241F" stroke-width="1.5"/><path d="M434 334L446 322" stroke="#23241F" stroke-width="1.5"/><text x="526" y="322" font-family="Archivo, 'Helvetica Neue', Arial, sans